[project]
name = "presolicitations"
version = "0.1.0"
description = "Daily, append-only mirror of SAM.gov presolicitation notices and their attachments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17",
    "huggingface_hub>=0.30",
]

[project.scripts]
presol = "presolicitations.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presolicitations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
